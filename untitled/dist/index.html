  <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>菌コロニー バトル（固有技＋アイテム拡張版）</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #gameContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    #pausedBadge {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: rgba(2,6,23,0.8);
      border: 1px solid #334155;
      border-radius: 999px;
      display: none;
      z-index: 5;
      pointer-events: none;
    }

    /* ===== アイテム説明（一番上） ===== */
    #itemRow {
      padding: 6px 10px 0;
      background: #020617;
      border-bottom: 1px solid #1f2937;
    }
    #itemLegend {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 10px;
      font-size: 11px;
      color: #cbd5e1;
      padding: 6px 8px;
      background: rgba(2,6,23,0.6);
      border: 1px solid #1f2937;
      border-radius: 10px;
    }
    .legendItem {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .legendIcon {
      width: 14px; height: 14px;
      border-radius: 3px;
      display: inline-block; flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .legendIcon.circle { border-radius: 999px; }

    /* ===== ログ（2段目） ===== */
    #logRow {
      padding: 4px 10px 0;
      background: #020617;
    }
    #logPanel {
      font-size: 11px;
      color: #cbd5e1;
      min-height: 70px;
      max-height: 90px;
      overflow: auto;
      padding: 6px 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1f2937;
      border-radius: 10px;
    }
    .logLine {
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.35;
      padding: 1px 0;
      white-space: nowrap;
    }
    .logTag {
      font-size: 11px;
      font-weight: 700;
      padding: 0 6px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      flex-shrink: 0;
      background: rgba(15,23,42,0.9);
    }
    .logMsg {
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== シャーレ（3段目） ===== */
    #canvasWrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 10px 0;
    }
    #gameCanvas {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 1 / 1;
      display: block;
      background: transparent;
      touch-action: manipulation;
    }

    /* ===== スコア・ボタン（4段目） ===== */
    #topBar {
      padding: 4px 10px 6px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #020617;
      border-top: 1px solid #1f2937;
    }
    #topLine {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #controlButtons {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    .ctrlBtn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #0b1220;
      color: #e5e7eb;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .ctrlBtn.active {
      outline: 2px solid #22c55e;
    }

    /* ===== 強化（5段目：アップグレード＋スキル） ===== */
    #bottomPanel {
      padding: 8px;
      border-top: 1px solid #1f2937;
      background: rgba(15, 23, 42, 0.98);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #upgrades {
      display: flex;
      gap: 8px;
    }
    #skills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .upgradeBtn, .skillBtn {
      flex: 1;
      padding: 6px 8px;
      border-radius: 999px;
      border: none;
      background: #111827;
      color: #e5e7eb;
      font-size: 12px;
      text-align: left;
    }
    .skillBtn { flex: 1 1 45%; }
    .upgradeBtn span, .skillBtn span { display: block; }
    .label {
      font-weight: 600;
      margin-bottom: 2px;
      font-size: 12px;
    }
    .level { font-size: 11px; opacity: 0.9; }
    .cost, .cooldown { font-size: 11px; opacity: 0.8; }
    .skillBtnActive { outline: 2px solid #22c55e; }
    .upgradeBtn:disabled, .skillBtn:disabled { opacity: 0.4; }

    /* ===== Overlay ===== */
    #messageOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #messageBox {
      width: min(520px, 94vw);
      padding: 16px 18px 16px;
      background: #020617;
      border-radius: 16px;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.75);
    }
    #messageBox h1 { margin: 0 0 8px; font-size: 18px; }
    #messageBox p { margin: 0 0 8px; font-size: 13px; line-height: 1.6; }

    .overlayBtn {
      margin-top: 8px;
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      color: #f9fafb;
      cursor: pointer;
    }
    #startButton { background: #16a34a; }
    #backToIntroBtn { background: #334155; }
    #restartButton { background: #3b82f6; display:none; }

    /* colony cards */
    #colonySelectScreen { display:none; }
    #colonyList {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .colonyCard {
      padding: 10px 10px 8px;
      background: #0b1220;
      border: 1px solid #1f2937;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      min-height: 120px;
    }
    .colonyCard:hover { border-color: #22c55e; }
    .colonyHeader {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 13px;
    }
    .colonySwatch {
      width: 14px; height: 14px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.6);
      flex: 0 0 auto;
    }
    .colonyMeta { font-size: 11px; color:#cbd5e1; line-height:1.4; }
    .colonySpecial {
      margin-top: auto;
      font-size: 11px;
      color: #e2e8f0;
      padding-top: 4px;
      border-top: 1px dashed #1f2937;
    }

    #resultText { display:none; margin-top:8px; font-weight:700; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="pausedBadge">PAUSED</div>

    <!-- アイテム説明 -->
    <div id="itemRow">
      <div id="itemLegend"></div>
    </div>

    <!-- ログ -->
    <div id="logRow">
      <div id="logPanel"></div>
    </div>

    <!-- シャーレ -->
    <div id="canvasWrapper">
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- スコア・支配率・一時停止・ステータスON/OFF -->
    <div id="topBar">
      <div id="topLine">
        <div>スコア: <span id="scoreText">0</span></div>
        <div>支配率: <span id="controlText">0%</span></div>

        <div id="controlButtons">
          <button class="ctrlBtn" id="pauseBtn">一時停止</button>
          <button class="ctrlBtn active" id="statusToggleBtn">ステータス表示: ON</button>
        </div>
      </div>
    </div>

    <!-- 強化（アップグレード＋スキル） -->
    <div id="bottomPanel">
      <div id="upgrades">
        <button class="upgradeBtn" id="growthBtn">
          <span class="label">増殖速度</span>
          <span class="level" id="growthLevelText">Lv -</span>
          <span class="cost" id="growthCostText">コスト -</span>
        </button>
        <button class="upgradeBtn" id="attackBtn">
          <span class="label">攻撃力</span>
          <span class="level" id="attackLevelText">Lv -</span>
          <span class="cost" id="attackCostText">コスト -</span>
        </button>
        <button class="upgradeBtn" id="defenseBtn">
          <span class="label">防御力</span>
          <span class="level" id="defenseLevelText">Lv -</span>
          <span class="cost" id="defenseCostText">コスト -</span>
        </button>
      </div>

      <div id="skills">
        <button class="skillBtn" id="nutrientBtn">
          <span class="label">栄養ブースト</span>
          <span class="level">増殖大幅アップ（防御やや低下）</span>
          <span class="cost">コスト 50</span>
          <span class="cooldown" id="nutrientCdText">準備完了</span>
        </button>
        <button class="skillBtn" id="toxinBtn">
          <span class="label">毒素放出</span>
          <span class="level">一番強い敵を侵食</span>
          <span class="cost">コスト 70</span>
          <span class="cooldown" id="toxinCdText">準備完了</span>
        </button>
        <button class="skillBtn" id="shieldBtn">
          <span class="label">防御シールド</span>
          <span class="level">一定時間防御大幅アップ</span>
          <span class="cost">コスト 50</span>
          <span class="cooldown" id="shieldCdText">準備完了</span>
        </button>
        <button class="skillBtn" id="specialBtn">
          <span class="label" id="specialNameText">固有技</span>
          <span class="level" id="specialDescText">説明</span>
          <span class="cost" id="specialCostText">コスト -</span>
          <span class="cooldown" id="specialCdText">準備完了</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Overlay screens ===== -->
  <div id="messageOverlay">
    <div id="messageBox">
      <!-- Intro -->
      <div id="introScreen">
        <h1>菌コロニー バトル</h1>
        <p>シャーレ上で自分の菌を増やし、他のコロニーに勝つことを目指すリアルタイム陣取りゲームです。</p>
        <p>時間経過と侵食でポイントを稼ぎ、増殖・攻撃・防御やスキルを強化します。</p>
        <p>10秒ごとに20%で突然変異が発生します（良い変異と悪い変異が半々／重複あり）。</p>
        <p>空きマスにはアイテムが出現し、自分も敵も拾えます。</p>
        <p>勝利条件：シャーレ100%支配、または他コロニー全滅です。</p>
        <button class="overlayBtn" id="startButton">コロニーを選ぶ</button>
      </div>

      <!-- Colony select -->
      <div id="colonySelectScreen">
        <h1>コロニー選択</h1>
        <p>8つのコロニーのうち1つを選んで開始してください。</p>
        <div id="colonyList"></div>
        <button class="overlayBtn" id="backToIntroBtn">戻る</button>
      </div>

      <!-- Result -->
      <p id="resultText"></p>
      <button class="overlayBtn" id="restartButton">もう一度遊ぶ</button>
    </div>
  </div>

  <script>
    window.addEventListener("load", () => {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const scoreText = document.getElementById("scoreText");
      const controlText = document.getElementById("controlText");
      const logPanel = document.getElementById("logPanel");

      const overlay = document.getElementById("messageOverlay");
      const introScreen = document.getElementById("introScreen");
      const colonySelectScreen = document.getElementById("colonySelectScreen");
      const colonyList = document.getElementById("colonyList");
      const startButton = document.getElementById("startButton");
      const backToIntroBtn = document.getElementById("backToIntroBtn");
      const restartButton = document.getElementById("restartButton");
      const resultText = document.getElementById("resultText");

      const growthBtn = document.getElementById("growthBtn");
      const attackBtn = document.getElementById("attackBtn");
      const defenseBtn = document.getElementById("defenseBtn");
      const growthLevelText = document.getElementById("growthLevelText");
      const attackLevelText = document.getElementById("attackLevelText");
      const defenseLevelText = document.getElementById("defenseLevelText");
      const growthCostText = document.getElementById("growthCostText");
      const attackCostText = document.getElementById("attackCostText");
      const defenseCostText = document.getElementById("defenseCostText");

      const nutrientBtn = document.getElementById("nutrientBtn");
      const toxinBtn = document.getElementById("toxinBtn");
      const shieldBtn = document.getElementById("shieldBtn");
      const nutrientCdText = document.getElementById("nutrientCdText");
      const toxinCdText = document.getElementById("toxinCdText");
      const shieldCdText = document.getElementById("shieldCdText");

      const specialBtn = document.getElementById("specialBtn");
      const specialNameText = document.getElementById("specialNameText");
      const specialDescText = document.getElementById("specialDescText");
      const specialCostText = document.getElementById("specialCostText");
      const specialCdText = document.getElementById("specialCdText");

      const pauseBtn = document.getElementById("pauseBtn");
      const statusToggleBtn = document.getElementById("statusToggleBtn");
      const pausedBadge = document.getElementById("pausedBadge");

      const itemLegend = document.getElementById("itemLegend");

      const gridW = 60;
      const gridH = 60;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

      let viewSize = 0;
      let dishRadius = 0;
      let dishCx = 0;
      let dishCy = 0;
      let cellSize = 0;
      let dishOffsetX = 0;
      let dishOffsetY = 0;

      let grid = null;
      let ageGrid = null;
      let colonies = [];
      let seeds = [];
      let playerColonyId = null;

      let gameState = "intro";
      let lastTimestamp = null;
      let timeAccumulator = 0;
      const STEP_MS = 80;
      const STEP_SEC = STEP_MS / 1000;

      let score = 0;

      const NUTRIENT_COST = 50;
      const NUTRIENT_DURATION = 6;
      const NUTRIENT_COOLDOWN = 20;

      const TOXIN_COST = 70;
      const TOXIN_COOLDOWN = 25;

      const SHIELD_COST = 50;
      const SHIELD_DURATION = 8;
      const SHIELD_COOLDOWN = 22;

      let mutationTimer = 0;
      let items = [];
      let itemSpawnTimer = 0;

      const BASE_CELL_LIFETIME = 50;
      const SAT_CELL_LIFETIME  = 22;
      const SAT_RADIUS = 5;
      const GROWTH_TTL_PENALTY_K = 0.10;

      let isPaused = false;
      let showStatus = true;

      const logs = [];
      function addLog(message, type = "info") {
        logs.push({ message, time: performance.now(), type });
        while (logs.length > 8) logs.shift();
        renderLogs();
      }
      function renderLogs() {
        logPanel.innerHTML = "";
        logs.forEach(log => {
          const row = document.createElement("div");
          row.className = "logLine";

          const tagSpan = document.createElement("span");
          tagSpan.className = "logTag";
          const msgSpan = document.createElement("span");
          msgSpan.className = "logMsg";

          let label = "情報";
          let color = "#9ca3af";

          switch (log.type) {
            case "mutation":
              label = "突然変異"; color = "#a855f7"; break;
            case "special":
              label = "スキル"; color = "#22c55e"; break;
            case "vanish":
              label = "消滅"; color = "#f97316"; break;
            case "item":
              label = "アイテム"; color = "#38bdf8"; break;
            default:
              label = "情報"; color = "#9ca3af"; break;
          }
          tagSpan.textContent = label;
          tagSpan.style.color = color;
          tagSpan.style.borderColor = color;

          msgSpan.textContent = log.message;

          row.appendChild(tagSpan);
          row.appendChild(msgSpan);
          logPanel.appendChild(row);
        });
        logPanel.scrollTop = logPanel.scrollHeight;
      }

      function resizeCanvas() {
        const wrapper = document.getElementById("canvasWrapper");
        const rect = wrapper.getBoundingClientRect();
        const size = Math.min(rect.width, rect.height || rect.width);
        const dpr = window.devicePixelRatio || 1;

        canvas.width = size * dpr;
        canvas.height = size * dpr;
        canvas.style.width = size + "px";
        canvas.style.height = size + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        viewSize = size;
        dishRadius = (viewSize / 2) - 8;
        dishCx = viewSize / 2;
        dishCy = viewSize / 2;
        cellSize = (dishRadius * 2) / gridW;
        dishOffsetX = dishCx - dishRadius;
        dishOffsetY = dishCy - dishRadius;
      }

      function cellInsideDish(x, y) {
        const px = dishOffsetX + (x + 0.5) * cellSize;
        const py = dishOffsetY + (y + 0.5) * cellSize;
        const dx = px - dishCx, dy = py - dishCy;
        return (dx*dx + dy*dy) <= dishRadius*dishRadius;
      }

      function isSaturated(x, y) {
        const r2 = SAT_RADIUS * SAT_RADIUS;
        for (let dy = -SAT_RADIUS; dy <= SAT_RADIUS; dy++) {
          for (let dx = -SAT_RADIUS; dx <= SAT_RADIUS; dx++) {
            if (dx*dx + dy*dy > r2) continue;
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || nx >= gridW || ny < 0 || ny >= gridH) continue;
            if (!cellInsideDish(nx, ny)) continue;
            if (grid[ny][nx] === -1) return false;
          }
        }
        return true;
      }

      // ===== 8コロニー初期化 =====
      function initColonies() {
        colonies = [];
        const colors = [
          "#ef4444","#3b82f6","#22c55e","#eab308",
          "#a855f7","#22d3ee","#f97316","#ec4899"
        ];
        const types = [
          { type: "aggressive", name: "攻撃特化",     display: "赤コロニー" },
          { type: "defensive",  name: "防御特化",     display: "青コロニー" },
          { type: "growth",     name: "増殖特化",     display: "緑コロニー" },
          { type: "trickster",  name: "撹乱特化",     display: "黄コロニー" },
          { type: "toxin",      name: "毒素特化",     display: "紫コロニー" },
          { type: "mutation",   name: "変異適応型",   display: "水色コロニー" },
          { type: "item",       name: "アイテム収集", display: "オレンジコロニー" },
          { type: "hardy",      name: "タフネス型",   display: "ピンクコロニー" }
        ];
        for (let i = 0; i < types.length; i++) {
          colonies.push({
            id: i,
            color: colors[i],
            type: types[i].type,
            typeName: types[i].name,
            displayName: types[i].display,
            growthLevel: 1,
            attackLevel: 1,
            defenseLevel: 1,
            alive: true,
            isPlayer: false,

            nutrientTime: 0,
            nutrientCooldown: 0,
            shieldTime: 0,
            shieldCooldown: 0,
            toxinCooldown: 0,

            specialCooldown: 0,
            rushTime: 0,
            fortifyTime: 0,
            toxicCloudTime: 0,
            hardyTime: 0,
            mutationShieldTime: 0,
            decayMistTime: 0,

            energy: 0,
            mutationState: {
              hyperGrowth: 0, killToxin: 0, thickBiofilm: 0,
              efficientResource: 0, focusedToxin: 0,
              slowMetabolism: 0, toxinSensitive: 0,
              fragileBiofilm: 0, shortLived: 0
            }
          });
        }
      }

      function setupSeeds() {
        seeds = [];
        const marginCells = 6;
        const n = colonies.length;
        for (let i = 0; i < n; i++) {
          let gx, gy, ok = false;
          while (!ok) {
            gx = Math.floor(Math.random() * (gridW - 2 * marginCells)) + marginCells;
            gy = Math.floor(Math.random() * (gridH - 2 * marginCells)) + marginCells;
            ok = true;
            for (const s of seeds) {
              if (Math.hypot(gx - s.gx, gy - s.gy) < 8) { ok = false; break; }
            }
          }
          seeds.push({ gx, gy, colonyId: i });
        }
      }

      function baseUpgradeCost(level) {
        return 10 + level * level * 5;
      }

      function upgradeCost(colony, kind) {
        const level = colony[kind + "Level"];
        let cost = baseUpgradeCost(level);

        switch (colony.type) {
          case "aggressive":
            if (kind === "attack") cost *= 0.6;
            if (kind === "defense") cost *= 1.3;
            break;
          case "defensive":
            if (kind === "defense") cost *= 0.6;
            if (kind === "attack") cost *= 1.3;
            cost *= 1.05;
            break;
          case "growth":
            if (kind === "growth") cost *= 0.6;
            if (kind === "attack") cost *= 1.2;
            break;
          case "trickster": cost *= 0.9; break;
          case "toxin":
            if (kind === "attack") cost *= 0.7;
            if (kind === "growth") cost *= 1.15;
            break;
          case "mutation": cost *= 0.95; break;
          case "item": cost *= 0.85; break;
          case "hardy":
            if (kind === "defense") cost *= 0.7;
            if (kind === "growth") cost *= 1.1;
            break;
        }

        if (kind === "growth" && grid) {
          let my = 0, cap = 0;
          for (let y=0; y<gridH; y++) for (let x=0; x<gridW; x++) {
            if (!cellInsideDish(x,y)) continue;
            cap++;
            if (grid[y][x] === colony.id) my++;
          }
          const areaRatio = cap > 0 ? my / cap : 0;
          const ALPHA = 1.5;
          cost *= (1 + ALPHA * areaRatio);
        }

        return Math.max(5, Math.floor(cost));
      }

      function getScoreMultiplier(colony) {
        if (!colony || !colony.mutationState) return 1;
        const ms = colony.mutationState;
        let m = 1;

        if (ms.efficientResource > 0) m += 0.5 * ms.efficientResource;
        if (ms.slowMetabolism > 0) m += 0.2 * ms.slowMetabolism;

        const defBonus = Math.max(0, colony.defenseLevel - 1);
        m *= (1 + 0.04 * defBonus);

        if (colony.type === "defensive" || colony.type === "hardy") m *= 1.25;
        if (colony.type === "item") m *= 1.1;

        return m;
      }

      function getGrowthRate(colony) {
        const gLevel = colony.growthLevel;
        const delta = Math.max(0, gLevel - 1);
        let rate = 0.03 + 0.25 * (1 - Math.exp(-0.18 * delta));

        if (colony.type === "growth") rate *= 1.2;
        if (colony.type === "defensive") rate *= 0.9;
        if (colony.type === "toxin") rate *= 0.92;
        if (colony.type === "hardy") rate *= 0.9;

        if (colony.nutrientTime > 0) rate *= 1.7;
        if (colony.fortifyTime > 0) rate *= 0.85;
        if (colony.toxicCloudTime > 0) rate *= 0.9;

        const ms = colony.mutationState || {};
        if (ms.hyperGrowth > 0) {
          const n = ms.hyperGrowth;
          rate *= Math.pow(2, Math.min(1, n)) * Math.pow(1.5, Math.max(0, n - 1));
        }
        if (ms.slowMetabolism > 0) rate *= Math.pow(0.5, ms.slowMetabolism);
        if (ms.thickBiofilm > 0) rate *= Math.pow(0.6, ms.thickBiofilm);

        if (rate > 0.9) rate = 0.9;
        if (rate < 0.001) rate = 0.001;
        return rate;
      }

      function getCombatStats(colony, role) {
        let atk = colony.attackLevel;
        let def = colony.defenseLevel;

        const g = Math.max(0, colony.growthLevel - 1);
        def -= g * 0.6;
        atk -= g * 0.25;

        const ms = colony.mutationState || {};

        if (colony.type === "aggressive" && role === "attacker") atk += 1;
        if (colony.type === "defensive") def += 1;
        if (colony.type === "trickster" && role === "attacker") atk += 0.5;
        if (colony.type === "toxin" && role === "attacker") atk += 0.8;
        if (colony.type === "hardy" && role === "defender") def += 0.7;

        if (role === "defender" && colony.shieldTime > 0) def += 2;
        if (colony.nutrientTime > 0 && role === "defender") def -= 1;

        if (ms.hyperGrowth > 0) def -= 2 * ms.hyperGrowth;
        if (ms.thickBiofilm > 0) def += 3 * ms.thickBiofilm;
        if (ms.fragileBiofilm > 0) def -= 2 * ms.fragileBiofilm;

        if (colony.rushTime > 0 && role==="attacker") atk += 3;
        if (colony.rushTime > 0 && role==="defender") def -= 2;

        if (colony.fortifyTime > 0 && role==="defender") def += 3;
        if (colony.toxicCloudTime > 0 && role==="attacker") atk += 2;
        if (colony.hardyTime > 0 && role==="defender") def += 3;

        return { atk, def };
      }

      function startGameWithPlayer(selectedId) {
        playerColonyId = selectedId;
        colonies.forEach(c => c.isPlayer = (c.id === playerColonyId));

        grid = Array.from({ length: gridH }, () => Array(gridW).fill(-1));
        ageGrid = Array.from({ length: gridH }, () => Array(gridW).fill(0));

        for (const s of seeds) {
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const x = s.gx + dx, y = s.gy + dy;
              if (x < 0 || x >= gridW || y < 0 || y >= gridH) continue;
              grid[y][x] = s.colonyId;
              ageGrid[y][x] = 0;
            }
          }
        }

        score = 0; scoreText.textContent = "0"; controlText.textContent = "0%";
        lastTimestamp = null; timeAccumulator = 0;
        mutationTimer = 0; items = []; itemSpawnTimer = 0;
        resetSkills();
        gameState = "running";
        updateUpgradeUI();
        updateLegendUI();
        addLog("ゲーム開始: " + colonies[playerColonyId].displayName, "info");
      }

      function endGame(win, ratio) {
        if (gameState !== "running") return;
        gameState = "over";
        overlay.style.display = "flex";
        introScreen.style.display = "none";
        colonySelectScreen.style.display = "none";
        restartButton.style.display = "block";
        resultText.style.display = "block";

        if (win) resultText.textContent = "勝利しました。支配率は約 " + (ratio ?? 0) + "% です。";
        else resultText.textContent = "あなたのコロニーは消滅しました。";
      }

      function findStrongestEnemy(aliveCounts) {
        if (playerColonyId === null) return null;
        let bestId = null, bestCount = 0;
        for (const c of colonies) {
          if (!c.alive || c.id === playerColonyId) continue;
          const cnt = aliveCounts[c.id] || 0;
          if (cnt > bestCount) { bestCount = cnt; bestId = c.id; }
        }
        return bestId;
      }

      function calcControl() {
        const counts = new Array(colonies.length).fill(0);
        if (!grid) return { counts, weakestColonyId: null };
        for (let y=0;y<gridH;y++) for (let x=0;x<gridW;x++) {
          const o = grid[y][x]; if (o>=0) counts[o]++;
        }
        let weakestColonyId=null, minCount=Infinity;
        colonies.forEach((c,idx)=>{
          if(!c.alive) return;
          if(counts[idx]<minCount){minCount=counts[idx];weakestColonyId=idx;}
        });
        return { counts, weakestColonyId };
      }

      // ===== アイテム定義 =====
      const ITEM_DEFS = [
        { id:"nutrient_storm",  name:"栄養ストーム",     kind:"benefit", weight:20, legend:"#22c55e", shape:"square",
          effect:"周囲侵食が進む" },
        { id:"antibiotic_bomb", name:"抗生物質ボム",     kind:"risk",    weight:10, legend:"#f9fafb", shape:"x",
          effect:"自領域が吹き飛ぶ" },
        { id:"mutation_reroll", name:"変異リロール",     kind:"benefit", weight:14, legend:"#a855f7", shape:"diamond",
          effect:"変異を引き直す" },
        { id:"growth_serum",    name:"成長血清",         kind:"benefit", weight:16, legend:"#16a34a", shape:"circle",
          effect:"栄養ブースト延長" },
        { id:"bio_armor",       name:"バイオアーマー",   kind:"benefit", weight:14, legend:"#60a5fa", shape:"ring",
          effect:"防御シールド付与" },
        { id:"phage_strike",    name:"ファージ爆撃",     kind:"benefit", weight:12, legend:"#f59e0b", shape:"bar",
          effect:"最強敵を削る" },

          effect:"スコア大量獲得" },
      ];
      function pickRandomItemTypeWeighted() {
        const totalW = ITEM_DEFS.reduce((s,d)=>s+d.weight,0);
        let r = Math.random() * totalW;
        for (const d of ITEM_DEFS) { r -= d.weight; if (r <= 0) return d.id; }
        return ITEM_DEFS[0].id;
      }
      function getItemDef(id){ return ITEM_DEFS.find(d=>d.id===id); }

      function updateLegendUI(){
        itemLegend.innerHTML = "";
        ITEM_DEFS.forEach(d=>{
          const row = document.createElement("div");
          row.className = "legendItem";
          const icon = document.createElement("span");
          icon.className = "legendIcon";
          icon.style.background = d.legend;
          if(d.shape==="circle"||d.shape==="ring") icon.classList.add("circle");
          row.appendChild(icon);

          const text = document.createElement("span");
          text.textContent = d.name + "： " + d.effect;
          row.appendChild(text);

          itemLegend.appendChild(row);
        });
      }

      function spawnItemIfNeeded() {
        const MAX_ITEMS = 5;
        if (items.length >= MAX_ITEMS || !grid) return;

        const info = calcControl();
        const weakest = info.weakestColonyId;

        for (let trial=0; trial<100; trial++) {
          const x= (Math.random()*gridW)|0;
          const y= (Math.random()*gridH)|0;
          if (grid[y][x] !== -1) continue;
          if (!cellInsideDish(x,y)) continue;

          if (weakest != null && Math.random() < 0.7) {
            let nearWeakest=false;
            for (let sy=0;sy<gridH && !nearWeakest;sy++) for (let sx=0;sx<gridW;sx++) {
              if (grid[sy][sx]===weakest) {
                const ddx=sx-x, ddy=sy-y;
                if (ddx*ddx+ddy*ddy<=100){nearWeakest=true;break;}
              }
            }
            if(!nearWeakest) continue;
          }

          items.push({ x,y,type: pickRandomItemTypeWeighted() });
          return;
        }
      }

      function checkItemPickup(x,y,colonyId){
        const colony=colonies[colonyId]; if(!colony) return;
        for(let i=0;i<items.length;i++){
          const it=items[i];
          if(it.x===x && it.y===y){
            applyItemEffect(it.type,colony);
            items.splice(i,1);
            break;
          }
        }
      }

      function itemEffectMultiplier(colony, itemKind){
        if (colony.type !== "item") return 1.0;
        if (itemKind === "benefit") return 1.35;
        if (itemKind === "risk")    return 0.60;
        return 1.0;
      }

      function performNutrientStorm(colonyId, mult=1.0){
        if(!grid) return;
        const attempts= Math.floor(1500 * mult);
        for(let i=0;i<attempts;i++){
          const x=(Math.random()*gridW)|0;
          const y=(Math.random()*gridH)|0;
          if(grid[y][x]!==colonyId) continue;
          const d=dirs[(Math.random()*4)|0];
          const nx=x+d[0], ny=y+d[1];
          if(nx<0||nx>=gridW||ny<0||ny>=gridH) continue;
          const owner=grid[ny][nx];
          if(owner===colonyId) continue;
          grid[ny][nx]=colonyId;
          ageGrid[ny][nx]=0;
          checkItemPickup(nx,ny,colonyId);
        }
      }

      function performAntibioticBomb(colonyId, mult=1.0){
        if(!grid) return;
        let sumX=0,sumY=0,cnt=0;
        for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
          if(grid[y][x]===colonyId){sumX+=x;sumY+=y;cnt++;}
        }
        if(cnt===0) return;
        const cx=sumX/cnt, cy=sumY/cnt;

        const radiusCells = Math.max(4, Math.floor(10 * mult));
        const r2=radiusCells*radiusCells;

        for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
          const dx=x-cx, dy=y-cy;
          if(dx*dx+dy*dy<=r2){
            grid[y][x]=-1;
            ageGrid[y][x]=0;
          }
        }
      }

      function rerollMutations(colony){
        const ms=colony.mutationState;
        for(const k in ms) ms[k]=0;
        const times=4;
        for(let i=0;i<times;i++){
          const pool=Math.random()<0.5?MUTATIONS_POS:MUTATIONS_NEG;
          pool[(Math.random()*pool.length)|0].apply(colony);
        }
      }

      function performPhageStrike(colonyId, mult=1.0){
        if(!grid) return;

        const aliveCounts=new Array(colonies.length).fill(0);
        for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
          const o=grid[y][x]; if(o>=0) aliveCounts[o]++;
        }
        const targetId = findStrongestEnemy(aliveCounts);
        if(targetId==null) return;

        const actions = Math.floor(800 * mult);
        for(let i=0;i<actions;i++){
          const x=(Math.random()*gridW)|0;
          const y=(Math.random()*gridH)|0;
          if(grid[y][x]!==targetId) continue;
          if(Math.random()<0.65){
            grid[y][x]=-1;
            ageGrid[y][x]=0;
          }
        }
      }

      function applyItemEffect(type,colony){
        const def = getItemDef(type);
        const kind = def?.kind || "benefit";
        const mult = itemEffectMultiplier(colony, kind);
        const who=colony.isPlayer?"あなたのコロニー":colony.displayName;

        switch(type){
          case "nutrient_storm":
            performNutrientStorm(colony.id, mult);
            addLog(who+"が【栄養ストーム】を発動", "item");
            break;
          case "antibiotic_bomb":
            performAntibioticBomb(colony.id, mult);
            addLog(who+"が【抗生物質ボム】を発動", "item");
            break;
          case "mutation_reroll":
            rerollMutations(colony);
            if (mult > 1.1) {
              MUTATIONS_POS[(Math.random()*MUTATIONS_POS.length)|0].apply(colony);
            }
            addLog(who+"が【変異リロール】を発動", "item");
            break;
          case "growth_serum":
            colony.nutrientTime = Math.max(colony.nutrientTime, 12 * mult);
            addLog(who+"が【成長血清】を獲得", "item");
            break;
          case "bio_armor":
            colony.shieldTime = Math.max(colony.shieldTime, 10 * mult);
            addLog(who+"が【バイオアーマー】を獲得", "item");
            break;
          case "phage_strike":
            performPhageStrike(colony.id, mult);
            addLog(who+"が【ファージ爆撃】を発動", "item");
            break;
          case "decay_mist":
            colony.decayMistTime = Math.max(colony.decayMistTime||0, 8 * mult);
            addLog(who+"が【腐敗ミスト】の影響を受けた", "item");
            break;
          case "score_cache":
            if (colony.isPlayer) score += 60 * mult;
            else colony.energy += 60 * mult;
            addLog(who+"が【スコアキャッシュ】を獲得", "item");
            break;
        }
      }

      // ===== 突然変異 =====
      const MUTATIONS_POS=[
        {id:"hyper_growth",name:"増殖暴走変異",desc:"増殖大幅アップ / 防御ダウン",apply(c){c.mutationState.hyperGrowth++;}},
        {id:"kill_toxin",name:"殲滅毒素変異",desc:"毒素効果アップ / 増殖ややダウン",apply(c){c.mutationState.killToxin++;}},
        {id:"thick_biofilm",name:"超厚バイオフィルム変異",desc:"防御大幅アップ / 増殖ダウン",apply(c){c.mutationState.thickBiofilm++;}},
        {id:"efficient_resource",name:"資源効率最適化変異",desc:"スコア獲得アップ",apply(c){c.mutationState.efficientResource++;}},
        {id:"focused_toxin",name:"選択毒性変異",desc:"最強の敵への毒素が効きやすい",apply(c){c.mutationState.focusedToxin++;}}
      ];
      const MUTATIONS_NEG=[
        {id:"slow_metabolism",name:"代謝異常変異",desc:"増殖大幅ダウン / スコア効率ややアップ",apply(c){c.mutationState.slowMetabolism++;}},
        {id:"toxin_sensitive",name:"毒素過敏変異",desc:"攻撃を受けたときに死にやすい",apply(c){c.mutationState.toxinSensitive++;}},
        {id:"fragile_biofilm",name:"脆弱バイオフィルム変異",desc:"防御ダウン / ハローで消えやすい",apply(c){c.mutationState.fragileBiofilm++;}},
        {id:"stat_shuffle",name:"遺伝情報錯乱変異",desc:"能力が大きく入れ替わる",apply(c){
          const stats=["growthLevel","attackLevel","defenseLevel"];
          const downIdx=(Math.random()*3)|0;
          let upIdx=(Math.random()*3)|0;
          if(upIdx===downIdx) upIdx=(upIdx+1)%3;
          c[stats[downIdx]]=Math.max(1,c[stats[downIdx]]-3);
          c[stats[upIdx]]+=3;
        }},
        {id:"short_lived",name:"短命化変異",desc:"マスが自然消滅しやすい",apply(c){c.mutationState.shortLived++;}}
      ];

      function triggerMutations(){
        if(gameState!=="running") return;
        colonies.forEach(colony=>{
          if(!colony.alive) return;
          const baseProb=0.2;
          const prob=colony.type==="mutation"?baseProb*1.3:baseProb;
          if(Math.random()>=prob) return;

          let pool;
          if (colony.mutationShieldTime > 0) {
            pool = MUTATIONS_POS;
          } else {
            let posBase=0.5; if(colony.type==="mutation") posBase=0.7;
            pool=(Math.random()<posBase)?MUTATIONS_POS:MUTATIONS_NEG;
          }

          const mut=pool[(Math.random()*pool.length)|0];
          mut.apply(colony);

          const who=colony.isPlayer?"あなたのコロニー":colony.displayName;
          addLog(who+"に【"+mut.name+"】が発生（"+mut.desc+"）", "mutation");
        });
      }

      // ===== 固有技 =====
      const SPECIALS = {
        aggressive: { name:"捕食ラッシュ", cost:90, cd:30,
          desc:"前線の敵を連続侵食（防御一時低下）" },
        defensive:  { name:"要塞化バリア", cost:80, cd:35,
          desc:"重心周辺の防御を大幅上昇（増殖やや低下）" },
        growth:     { name:"胞子バースト", cost:100, cd:40,
          desc:"遠距離に新規スポーンを複数作る" },
        trickster:  { name:"テリトリースワップ", cost:110, cd:45,
          desc:"最強の敵と領域を部分交換して形を崩す" },
        toxin:      { name:"毒雲散布", cost:90, cd:32,
          desc:"8秒間、毒素キル率と侵食効率を上げる" },
        mutation:   { name:"適応リライト", cost:70, cd:30,
          desc:"悪変異軽減＋良変異追加＋悪変異耐性" },
        item:       { name:"スカベンジ・マグネット", cost:60, cd:25,
          desc:"アイテム引き寄せ＋追加生成" },
        hardy:      { name:"休眠再生モード", cost:85, cd:35,
          desc:"防御と寿命を強化（発動時に一部犠牲）" }
      };

      function useSpecial(colony){
        const sp = SPECIALS[colony.type];
        if(!sp) return;

        if(colony.isPlayer){
          if(Math.floor(score) < sp.cost || colony.specialCooldown>0) return;
          score -= sp.cost;
          scoreText.textContent = Math.floor(score).toString();
        }else{
          if(colony.energy < sp.cost || colony.specialCooldown>0) return;
          colony.energy -= sp.cost;
        }
        colony.specialCooldown = sp.cd;

        switch(colony.type){
          case "aggressive": performPredationRush(colony.id); break;
          case "defensive":  performFortifyBarrier(colony.id); break;
          case "growth":     performSporeBurst(colony.id); break;
          case "trickster":  performTerritorySwap(colony.id); break;
          case "toxin":      performToxicCloud(colony.id); break;
          case "mutation":   performAdaptiveRewrite(colony); break;
          case "item":       performScavengeMagnet(colony.id); break;
          case "hardy":      performDormantRegrowth(colony.id); break;
        }

        const who = colony.isPlayer ? "あなたのコロニー" : colony.displayName;
        addLog(who + "が【" + sp.name + "】を発動", "special");
      }

      function performPredationRush(colonyId){
        if(!grid) return;
        const c = colonies[colonyId];
        c.rushTime = 6;

        const actions = 1200;
        for(let i=0;i<actions;i++){
          const x=(Math.random()*gridW)|0;
          const y=(Math.random()*gridH)|0;
          if(grid[y][x]!==colonyId) continue;

          const d=dirs[(Math.random()*4)|0];
          const nx=x+d[0], ny=y+d[1];
          if(nx<0||nx>=gridW||ny<0||ny>=gridH) continue;

          if(grid[ny][nx]>=0 && grid[ny][nx]!==colonyId){
            if(Math.random()<0.8){
              grid[ny][nx]=colonyId; ageGrid[ny][nx]=0;
              checkItemPickup(nx,ny,colonyId);
            }
          }
        }
      }

      function performFortifyBarrier(colonyId){
        if(!grid) return;
        const c = colonies[colonyId];
        c.fortifyTime = 12;

        let sumX=0,sumY=0,cnt=0;
        for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
          if(grid[y][x]===colonyId){sumX+=x;sumY+=y;cnt++;}
        }
        if(cnt===0) return;
        const cx=sumX/cnt, cy=sumY/cnt;
        const r=6, r2=r*r;
        for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
          const dx=x-cx, dy=y-cy;
          if(dx*dx+dy*dy<=r2 && grid[y][x]===-1 && cellInsideDish(x,y)){
            grid[y][x]=colonyId; ageGrid[y][x]=0;
          }
        }
      }

      function performSporeBurst(colonyId){
        if(!grid) return;
        const spores = 12;
        for(let i=0;i<spores;i++){
          for(let t=0;t<80;t++){
            const x=(Math.random()*gridW)|0;
            const y=(Math.random()*gridH)|0;
            if(!cellInsideDish(x,y) || grid[y][x]!==-1) continue;

            grid[y][x]=colonyId;
            ageGrid[y][x]=BASE_CELL_LIFETIME*0.5;
            break;
          }
        }
      }

      function performTerritorySwap(colonyId){
        if(!grid) return;

        const aliveCounts=new Array(colonies.length).fill(0);
        for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
          const o=grid[y][x]; if(o>=0) aliveCounts[o]++;
        }
        const targetId = findStrongestEnemy(aliveCounts);
        if(targetId==null) return;

        let swaps = 120;

        for(let k=0;k<swaps;k++){
          for(let t=0;t<120;t++){
            const x=(Math.random()*gridW)|0;
            const y=(Math.random()*gridH)|0;
            if(grid[y][x]===targetId && cellInsideDish(x,y)){
              grid[y][x]=colonyId; ageGrid[y][x]=0;
              break;
            }
          }
        }

        for(let k=0;k<swaps;k++){
          for(let t=0;t<120;t++){
            const x=(Math.random()*gridW)|0;
            const y=(Math.random()*gridH)|0;
            if(grid[y][x]===colonyId && cellInsideDish(x,y)){
              grid[y][x]=targetId; ageGrid[y][x]=0;
              break;
            }
          }
        }
      }

      function performToxicCloud(colonyId){
        const c = colonies[colonyId];
        c.toxicCloudTime = 8;
      }

      function performAdaptiveRewrite(colony){
        const ms=colony.mutationState;
        const negKeys=["slowMetabolism","toxinSensitive","fragileBiofilm","shortLived"];
        negKeys.forEach(k=>{ if(ms[k]>0) ms[k]--; });

        for(let i=0;i<2;i++){
          MUTATIONS_POS[(Math.random()*MUTATIONS_POS.length)|0].apply(colony);
        }
        colony.mutationShieldTime = 20;
      }

      function performScavengeMagnet(colonyId){
        if(!grid) return;

        for(const it of items){
          for(let t=0;t<80;t++){
            const x=(Math.random()*gridW)|0;
            const y=(Math.random()*gridH)|0;
            if(grid[y][x]!==colonyId) continue;

            const d=dirs[(Math.random()*4)|0];
            const nx=x+d[0], ny=y+d[1];
            if(nx<0||nx>=gridW||ny<0||ny>=gridH) continue;
            if(grid[ny][nx]!==-1 || !cellInsideDish(nx,ny)) continue;

            it.x=nx; it.y=ny;
            break;
          }
        }
        spawnItemIfNeeded();
      }

      function performDormantRegrowth(colonyId){
        if(!grid) return;
        const c = colonies[colonyId];
        c.hardyTime = 12;

        const sacrifices = 150;
        for(let i=0;i<sacrifices;i++){
          const x=(Math.random()*gridW)|0;
          const y=(Math.random()*gridH)|0;
          if(grid[y][x]===colonyId){
            grid[y][x]=-1; ageGrid[y][x]=0;
          }
        }
      }

      // ===== AI行動 =====
      function aiTakeActions(aliveCounts,totalCells){
        for(const c of colonies){
          if(!c.alive || c.id===playerColonyId) continue;
          const myCells=aliveCounts[c.id]||0;
          const weakRatio=totalCells>0?myCells/totalCells:0;

          const upgradeOptions=["growth","attack","defense"];
          if(c.type==="aggressive") upgradeOptions.push("attack","attack");
          if(c.type==="defensive") upgradeOptions.push("defense","defense");
          if(c.type==="growth") upgradeOptions.push("growth","growth");
          if(c.type==="hardy") upgradeOptions.push("defense");
          if(c.type==="toxin") upgradeOptions.push("attack");
          if(c.type==="item") upgradeOptions.push("growth","attack","defense");

          const choice=upgradeOptions[(Math.random()*upgradeOptions.length)|0];
          const cost=upgradeCost(c,choice);
          if(c.energy>=cost && Math.random()<0.5){
            c.energy-=cost; c[choice+"Level"]++;
          }

          let nutProb=0.15, shieldProb=0.15, toxinProb=0.08;
          if(c.type==="growth") nutProb+=0.1;
          if(c.type==="defensive"||c.type==="hardy") shieldProb+=0.1;
          if(c.type==="trickster") toxinProb+=0.05;
          if(c.type==="toxin") toxinProb+=0.07;

          if(c.energy>=NUTRIENT_COST && c.nutrientCooldown<=0 &&
             (weakRatio<0.25||Math.random()<nutProb)){
            c.energy-=NUTRIENT_COST;
            c.nutrientTime=NUTRIENT_DURATION;
            c.nutrientCooldown=NUTRIENT_COOLDOWN;
          }

          if(c.energy>=SHIELD_COST && c.shieldCooldown<=0 &&
             (weakRatio<0.3||Math.random()<shieldProb)){
            c.energy-=SHIELD_COST;
            c.shieldTime=SHIELD_DURATION;
            c.shieldCooldown=SHIELD_COOLDOWN;
          }

          if(c.energy>=TOXIN_COST && c.toxinCooldown<=0 &&
             (weakRatio<0.2||Math.random()<toxinProb)){
            c.energy-=TOXIN_COST;
            c.toxinCooldown=TOXIN_COOLDOWN;

            let targetId=playerColonyId;
            const playerCells=playerColonyId!=null?(aliveCounts[playerColonyId]||0):0;
            if(playerColonyId!=null && playerCells<myCells){
              let strongest=null,bestCount=0;
              for(const cc of colonies){
                if(!cc.alive||cc.id===c.id) continue;
                const cnt=aliveCounts[cc.id]||0;
                if(cnt>bestCount){bestCount=cnt;strongest=cc.id;}
              }
              if(strongest!=null) targetId=strongest;
            }
            const ms=c.mutationState||{};
            performToxinBurstFor(c.id,targetId,ms.focusedToxin>0);
          }

          const sp = SPECIALS[c.type];
          if (sp && c.specialCooldown<=0 && c.energy>=sp.cost) {
            let useProb = 0.05;
            if (weakRatio < 0.2) useProb += 0.12;
            if (c.type==="item" && items.length>0) useProb += 0.12;
            if (c.type==="growth" && weakRatio < 0.35) useProb += 0.08;

            if (Math.random() < useProb) useSpecial(c);
          }
        }
      }

      function performToxinBurstFor(colonyId,targetId,focused){
        if(!grid) return;
        const actions=focused?1000:800;
        for(let i=0;i<actions;i++){
          const x=(Math.random()*gridW)|0;
          const y=(Math.random()*gridH)|0;

          if(targetId!=null){
            if(grid[y][x]!==targetId) continue;
            let near=false;
            for(const d of dirs){
              const nx=x+d[0], ny=y+d[1];
              if(nx<0||nx>=gridW||ny<0||ny>=gridH) continue;
              if(grid[ny][nx]===colonyId){near=true;break;}
            }
            if(!near) continue;
            if(Math.random()< (focused?0.9:0.8)){
              grid[y][x]=colonyId;
              ageGrid[y][x]=0;
              checkItemPickup(x,y,colonyId);
            }
          }else{
            if(grid[y][x]!==colonyId) continue;
            const d=dirs[(Math.random()*4)|0];
            const nx=x+d[0], ny=y+d[1];
            if(nx<0||nx>=gridW||ny<0||ny>=gridH) continue;
            const targetOwner=grid[ny][nx];
            if(targetOwner>=0 && targetOwner!==colonyId){
              if(Math.random()< (focused?0.9:0.8)){
                grid[ny][nx]=colonyId;
                ageGrid[ny][nx]=0;
                checkItemPickup(nx,ny,colonyId);
              }
            }
          }
        }
      }

      // ===== シミュレーション =====
      function stepSimulation(){
        if(gameState!=="running"||!grid) return;

        const actionsPerStep=550;

        for(let i=0;i<actionsPerStep;i++){
          const x=(Math.random()*gridW)|0;
          const y=(Math.random()*gridH)|0;
          const owner=grid[y][x];
          if(owner<0) continue;

          const colony=colonies[owner];
          const base=getGrowthRate(colony);
          if(Math.random()>base) continue;

          const d=dirs[(Math.random()*4)|0];
          const nx=x+d[0], ny=y+d[1];
          if(nx<0||nx>=gridW||ny<0||ny>=gridH) continue;

          const targetOwner=grid[ny][nx];
          if(targetOwner===owner) continue;

          if(targetOwner===-1){
            grid[ny][nx]=owner;
            ageGrid[ny][nx]=0;
            checkItemPickup(nx,ny,owner);
          }else{
            const attacker=colony;
            const defender=colonies[targetOwner];

            const atkStats=getCombatStats(attacker,"attacker");
            const defStats=getCombatStats(defender,"defender");

            let diff=atkStats.atk-defStats.def;
            let winProb=0.5+0.09*diff;

            const aMS=attacker.mutationState||{};
            const dMS=defender.mutationState||{};

            if(attacker.type==="aggressive") winProb+=0.02;
            if(defender.type==="defensive") winProb-=0.03;
            if(attacker.type==="toxin") winProb+=0.02;
            if(aMS.killToxin>0) winProb+=0.05*aMS.killToxin;
            if(dMS.toxinSensitive>0) winProb+=0.05*dMS.toxinSensitive;

            winProb=Math.min(0.95,Math.max(0.05,winProb));

            if(Math.random()<winProb){
              grid[ny][nx]=owner;
              ageGrid[ny][nx]=0;
              checkItemPickup(nx,ny,owner);
              if(owner===playerColonyId) score+=1;
              else colonies[owner].energy+=1;
            }else{
              const defReward = 0.25 + Math.max(0, defStats.def) * 0.03;
              if (targetOwner === playerColonyId) score += defReward;
              else defender.energy += defReward;

              let counterProb=0.05+Math.max(0,defStats.def)*0.02;
              if(dMS.thickBiofilm>0) counterProb+=0.03*dMS.thickBiofilm;
              counterProb=Math.min(0.4,counterProb);
              if(Math.random()<counterProb){
                grid[y][x]=-1;
                ageGrid[y][x]=0;
              }
            }
          }
        }

        const haloActions=260;
        for(let i=0;i<haloActions;i++){
          const x=(Math.random()*gridW)|0;
          const y=(Math.random()*gridH)|0;
          const owner=grid[y][x];
          if(owner<0) continue;

          const col=colonies[owner];
          if(col.attackLevel<=1 && (!col.mutationState||col.mutationState.killToxin===0)) continue;

          const d=dirs[(Math.random()*4)|0];
          const nx=x+d[0], ny=y+d[1];
          if(nx<0||nx>=gridW||ny<0||ny>=gridH) continue;

          const targetOwner=grid[ny][nx];
          if(targetOwner<0||targetOwner===owner) continue;

          const defender=colonies[targetOwner];
          let baseKill=0.01*col.attackLevel;
          const msA=col.mutationState||{};
          const msD=defender.mutationState||{};

          if(msA.killToxin>0||col.type==="toxin"){
            baseKill*=(1+0.7*(msA.killToxin+(col.type==="toxin"?1:0)));
          }
          baseKill*=(1-0.08*defender.defenseLevel);
          if(msD.thickBiofilm>0||defender.type==="hardy"){
            baseKill*=Math.pow(0.6,msD.thickBiofilm+(defender.type==="hardy"?1:0));
          }
          if(msD.fragileBiofilm>0) baseKill*=(1+0.7*msD.fragileBiofilm);
          if(msD.toxinSensitive>0) baseKill*=(1+0.5*msD.toxinSensitive);

          if (col.toxicCloudTime > 0) baseKill *= 1.8;

          baseKill=Math.min(0.6,Math.max(0.001,baseKill));
          if(Math.random()<baseKill){
            grid[ny][nx]=-1;
            ageGrid[ny][nx]=0;
          }
        }

        const lifetimeActions=250;
        for(let i=0;i<lifetimeActions;i++){
          const x=(Math.random()*gridW)|0;
          const y=(Math.random()*gridH)|0;
          const owner=grid[y][x];
          if(owner<0) continue;
          const col=colonies[owner];
          const ms=col.mutationState||{};
          if(ms.shortLived>0){
            const p=0.005*ms.shortLived;
            if(Math.random()<p){
              grid[y][x]=-1;
              ageGrid[y][x]=0;
            }
          }
        }

        for (let y = 0; y < gridH; y++) {
          for (let x = 0; x < gridW; x++) {
            if (grid[y][x] < 0) continue;
            if (!cellInsideDish(x, y)) continue;

            ageGrid[y][x] += STEP_SEC;

            const owner = grid[y][x];
            const col = colonies[owner];

            let ttlBase = isSaturated(x, y) ? SAT_CELL_LIFETIME : BASE_CELL_LIFETIME;

            if ((col.mutationState?.shortLived || 0) > 0) {
              ttlBase *= Math.pow(0.85, col.mutationState.shortLived);
            }
            if ((col.decayMistTime || 0) > 0) {
              ttlBase *= 0.7;
            }
            if (col.hardyTime > 0) {
              ttlBase *= 1.4;
            }

            const growthPenalty = 1 + GROWTH_TTL_PENALTY_K * (col.growthLevel - 1);
            const ttl = ttlBase / growthPenalty;

            if (ageGrid[y][x] >= ttl) {
              grid[y][x] = -1;
              ageGrid[y][x] = 0;
            }
          }
        }

        let total=0, playerCells=0, capacityCells=0;
        const aliveCounts=new Array(colonies.length).fill(0);

        for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
          const o=grid[y][x];
          if(cellInsideDish(x,y)) capacityCells++;
          if(o>=0){
            aliveCounts[o]++; total++;
            if(o===playerColonyId && cellInsideDish(x,y)) playerCells++;
          }
        }

        // aliveフラグと消滅ログ
        colonies.forEach((c,idx)=>{
          const prevAlive = c.alive;
          const nowAlive = aliveCounts[idx] > 0;
          if (prevAlive && !nowAlive) {
            const who = c.isPlayer ? "あなたのコロニー" : c.displayName;
            addLog(who + "がシャーレから消滅", "vanish");
          }
          c.alive = nowAlive;
        });

        for(let i=0;i<colonies.length;i++){
          const c=colonies[i];
          if(!c.alive||i===playerColonyId) continue;
          const mult=getScoreMultiplier(c);
          c.energy += (aliveCounts[i]||0) * 0.0016 * mult;
        }

        aiTakeActions(aliveCounts,total);

        if(playerColonyId!=null){
          if(playerCells<=0){
            scoreText.textContent=Math.floor(score).toString();
            controlText.textContent="0%";
            endGame(false,0);
            return;
          }

          const ratio=capacityCells>0?Math.round((playerCells/capacityCells)*100):0;
          controlText.textContent=ratio+"%";

          const pCol=colonies[playerColonyId];
          const mult=getScoreMultiplier(pCol);
          score += playerCells * 0.007 * mult;

          scoreText.textContent=Math.floor(score).toString();
          updateUpgradeUI();

          let othersAlive=false;
          for(let i=0;i<colonies.length;i++){
            if(i===playerColonyId) continue;
            if(aliveCounts[i]>0){othersAlive=true;break;}
          }
          const fullControl=(capacityCells>0 && playerCells>=capacityCells);
          if(!othersAlive||fullControl) endGame(true,ratio);
        }
      }

      // ===== 重心ステータス表示 =====
      function computeOverlayData() {
        if (!grid) return null;
        const n = colonies.length;
        const counts = new Array(n).fill(0);
        const sumPx = new Array(n).fill(0);
        const sumPy = new Array(n).fill(0);

        let capacityCells = 0;
        const cs = cellSize;

        for (let y = 0; y < gridH; y++) {
          for (let x = 0; x < gridW; x++) {
            const px = dishOffsetX + (x + 0.5) * cs;
            const py = dishOffsetY + (y + 0.5) * cs;
            const dx = px - dishCx, dy = py - dishCy;
            const insideDish = (dx*dx + dy*dy) <= dishRadius*dishRadius;
            if (!insideDish) continue;

            capacityCells++;

            const o = grid[y][x];
            if (o >= 0) {
              counts[o]++;
              sumPx[o] += px;
              sumPy[o] += py;
            }
          }
        }

        const data = [];
        for (let i = 0; i < n; i++) {
          if (counts[i] <= 0) continue;
          const c = colonies[i];

          const effGrowth = getGrowthRate(c);
          const effAtk = getCombatStats(c, "attacker").atk;
          const effDef = getCombatStats(c, "defender").def;

          data.push({
            id: i,
            cx: sumPx[i] / counts[i],
            cy: sumPy[i] / counts[i],
            ratio: capacityCells > 0 ? counts[i] / capacityCells : 0,
            effGrowth, effAtk, effDef
          });
        }

        return { data, capacityCells };
      }

      function roundRectPath(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w/2, h/2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      function fmt(num, digits = 2) {
        return Number.isFinite(num) ? num.toFixed(digits) : "0.00";
      }

      function drawColonyLabels(overlayInfo) {
        if (!overlayInfo || !showStatus) return;
        const { data } = overlayInfo;

        ctx.save();
        ctx.font = "10px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const padX = 4;
        const padY = 3;
        const lineH = 11;

        for (const d of data) {
          const col = colonies[d.id];
          const ratioPct = Math.round(d.ratio * 100);

          const line1 = `支配:${ratioPct}%`;
          const line2 = `増殖:${Math.round(d.effGrowth*100)}%`;
          const line3 = `攻:${fmt(d.effAtk,1)} 防:${fmt(d.effDef,1)}`;

          const w = Math.max(
            ctx.measureText(line1).width,
            ctx.measureText(line2).width,
            ctx.measureText(line3).width
          ) + padX*2;
          const h = lineH*3 + padY*2;

          let x = d.cx;
          let y = d.cy;
          const margin = 6;
          x = Math.max(margin + w/2, Math.min(viewSize - margin - w/2, x));
          y = Math.max(margin + h/2, Math.min(viewSize - margin - h/2, y));

          const boxX = x - w/2;
          const boxY = y - h/2;

          ctx.globalAlpha = 0.55;
          ctx.fillStyle = "#000000";
          roundRectPath(ctx, boxX, boxY, w, h, 6);
          ctx.fill();

          ctx.globalAlpha = 0.75;
          ctx.strokeStyle = col.color;
          ctx.lineWidth = 1;
          roundRectPath(ctx, boxX, boxY, w, h, 6);
          ctx.stroke();

          ctx.globalAlpha = 0.95;
          ctx.fillStyle = "#ffffff";
          ctx.fillText(line1, x, boxY + padY + lineH*0.5);
          ctx.fillText(line2, x, boxY + padY + lineH*1.5);
          ctx.fillText(line3, x, boxY + padY + lineH*2.5);
        }

        ctx.restore();
      }

      // ===== 描画：丸のみ =====
      function drawSimpleColonies() {
        const cs = cellSize;
        for (let y = 0; y < gridH; y++) {
          for (let x = 0; x < gridW; x++) {
            const owner = grid[y][x];
            if (owner < 0) continue;
            if (!cellInsideDish(x, y)) continue;

            const px = dishOffsetX + (x + 0.5) * cs;
            const py = dishOffsetY + (y + 0.5) * cs;

            ctx.beginPath();
            ctx.arc(px, py, cs * 0.46, 0, Math.PI * 2);
            ctx.fillStyle = colonies[owner].color;
            ctx.fill();
          }
        }
      }

      function drawItems(){
        const cs=cellSize;
        for(const it of items){
          if(!cellInsideDish(it.x,it.y)) continue;
          const px=dishOffsetX+(it.x+0.5)*cs;
          const py=dishOffsetY+(it.y+0.5)*cs;

          const def = getItemDef(it.type);
          if(!def) continue;

          ctx.save();
          ctx.globalAlpha = 0.95;

          if(def.shape==="square"){
            ctx.fillStyle=def.legend;
            ctx.fillRect(px-cs*0.3,py-cs*0.3,cs*0.6,cs*0.6);
          }else if(def.shape==="x"){
            ctx.strokeStyle=def.legend; ctx.lineWidth=2;
            ctx.beginPath();
            ctx.moveTo(px-cs*0.35,py-cs*0.35); ctx.lineTo(px+cs*0.35,py+cs*0.35);
            ctx.moveTo(px+cs*0.35,py-cs*0.35); ctx.lineTo(px-cs*0.35,py+cs*0.35);
            ctx.stroke();
          }else if(def.shape==="diamond"){
            ctx.fillStyle=def.legend;
            ctx.beginPath();
            ctx.moveTo(px,py-cs*0.4);
            ctx.lineTo(px+cs*0.4,py);
            ctx.lineTo(px,py+cs*0.4);
            ctx.lineTo(px-cs*0.4,py);
            ctx.closePath(); ctx.fill();
          }else if(def.shape==="circle"){
            ctx.fillStyle=def.legend;
            ctx.beginPath(); ctx.arc(px,py,cs*0.33,0,Math.PI*2); ctx.fill();
          }else if(def.shape==="ring"){
            ctx.strokeStyle=def.legend; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(px,py,cs*0.34,0,Math.PI*2); ctx.stroke();
          }else if(def.shape==="bar"){
            ctx.fillStyle=def.legend;
            ctx.fillRect(px-cs*0.4,py-cs*0.12,cs*0.8,cs*0.24);
          }
          ctx.restore();
        }
      }

      function draw(){
        if(!viewSize) return;
        ctx.clearRect(0,0,viewSize,viewSize);

        ctx.beginPath();
        ctx.arc(dishCx,dishCy,dishRadius,0,Math.PI*2);
        ctx.fillStyle="#020617";
        ctx.fill();
        ctx.lineWidth=4; ctx.strokeStyle="#111827"; ctx.stroke();

        if(gameState==="select"||!grid){
          ctx.globalAlpha=0.9;
          for(const s of seeds){
            const px=dishOffsetX+(s.gx+0.5)*cellSize;
            const py=dishOffsetY+(s.gy+0.5)*cellSize;
            ctx.beginPath(); ctx.arc(px,py,cellSize*1.8,0,Math.PI*2);
            ctx.fillStyle=colonies[s.colonyId].color; ctx.fill();
          }
          ctx.globalAlpha=1; return;
        }

        drawSimpleColonies();
        drawItems();

        const overlayInfo = computeOverlayData();
        drawColonyLabels(overlayInfo);
      }

      function gameLoop(timestamp){
        if(!lastTimestamp) lastTimestamp=timestamp;
        const dt=timestamp-lastTimestamp; lastTimestamp=timestamp;

        if(gameState==="running" && !isPaused){
          timeAccumulator+=dt;
          const dtSec=dt/1000;

          mutationTimer+=dtSec;
          while(mutationTimer>=10){triggerMutations(); mutationTimer-=10;}

          itemSpawnTimer+=dtSec;
          while(itemSpawnTimer>=5){spawnItemIfNeeded(); itemSpawnTimer-=5;}

          while(timeAccumulator>=STEP_MS){
            stepSimulation();
            timeAccumulator-=STEP_MS;
          }

          colonies.forEach(c=>{
            if(c.nutrientTime>0) c.nutrientTime=Math.max(0,c.nutrientTime-dtSec);
            if(c.shieldTime>0) c.shieldTime=Math.max(0,c.shieldTime-dtSec);
            if(c.nutrientCooldown>0) c.nutrientCooldown=Math.max(0,c.nutrientCooldown-dtSec);
            if(c.shieldCooldown>0) c.shieldCooldown=Math.max(0,c.shieldCooldown-dtSec);
            if(c.toxinCooldown>0) c.toxinCooldown=Math.max(0,c.toxinCooldown-dtSec);

            if(c.specialCooldown>0) c.specialCooldown=Math.max(0,c.specialCooldown-dtSec);
            if(c.rushTime>0) c.rushTime=Math.max(0,c.rushTime-dtSec);
            if(c.fortifyTime>0) c.fortifyTime=Math.max(0,c.fortifyTime-dtSec);
            if(c.toxicCloudTime>0) c.toxicCloudTime=Math.max(0,c.toxicCloudTime-dtSec);
            if(c.hardyTime>0) c.hardyTime=Math.max(0,c.hardyTime-dtSec);
            if(c.mutationShieldTime>0) c.mutationShieldTime=Math.max(0,c.mutationShieldTime-dtSec);
            if(c.decayMistTime>0) c.decayMistTime=Math.max(0,c.decayMistTime-dtSec);
          });
          updateSkillUI();
        }

        draw();
        requestAnimationFrame(gameLoop);
      }

      // ===== Overlay制御 =====
      function showIntro(){
        overlay.style.display="flex";
        introScreen.style.display="block";
        colonySelectScreen.style.display="none";
        restartButton.style.display="none";
        resultText.style.display="none";
        gameState="intro";
        score=0; scoreText.textContent="0"; controlText.textContent="0%";
        colonies=[]; logs.length=0; items=[];
        renderLogs(); updateSkillUI();
      }

      function showColonySelect(){
        overlay.style.display="flex";
        introScreen.style.display="none";
        colonySelectScreen.style.display="block";
        restartButton.style.display="none";
        resultText.style.display="none";
      }

      function buildColonyCards(){
        colonyList.innerHTML = "";
        colonies.forEach(c=>{
          const sp = SPECIALS[c.type];
          const card = document.createElement("div");
          card.className = "colonyCard";
          card.innerHTML = `
            <div class="colonyHeader">
              <span class="colonySwatch" style="background:${c.color}"></span>
              <span>${c.displayName}</span>
            </div>
            <div class="colonyMeta">特性：${c.typeName}</div>
            <div class="colonyMeta">
              方向性：${describeTypeShort(c.type)}
            </div>
            <div class="colonySpecial">
              固有技：${sp.name}（コスト${sp.cost} / CD${sp.cd}秒）<br>
              ${sp.desc}
            </div>
          `;
          card.addEventListener("click", ()=>{
            overlay.style.display="none";
            startGameWithPlayer(c.id);
          });
          colonyList.appendChild(card);
        });
      }

      function describeTypeShort(type){
        switch(type){
          case "aggressive": return "攻撃コスト安／防御高め難";
          case "defensive": return "防御コスト安／スコア効率高";
          case "growth": return "増殖コスト安／拡散しやすい";
          case "trickster": return "全体コスト少し安／撹乱向き";
          case "toxin": return "攻撃寄り／毒素強化";
          case "mutation": return "良変異に寄りやすい";
          case "item": return "アイテム効果が増幅";
          case "hardy": return "防御・寿命寄りで粘る";
          default: return "";
        }
      }

      // ===== イベント =====
      startButton.addEventListener("click", ()=>{
        startSelecting();
        showColonySelect();
      });
      backToIntroBtn.addEventListener("click", showIntro);
      restartButton.addEventListener("click", ()=>{
        startSelecting();
        showColonySelect();
      });

      window.addEventListener("resize", resizeCanvas);

      pauseBtn.addEventListener("click", () => {
        if (gameState !== "running") return;
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? "再開" : "一時停止";
        pausedBadge.style.display = isPaused ? "block" : "none";
      });

      statusToggleBtn.addEventListener("click", () => {
        showStatus = !showStatus;
        statusToggleBtn.textContent = "ステータス表示: " + (showStatus ? "ON" : "OFF");
        showStatus ? statusToggleBtn.classList.add("active") : statusToggleBtn.classList.remove("active");
      });

      growthBtn.addEventListener("click", ()=>{
        if(playerColonyId===null||gameState!=="running") return;
        const p=colonies[playerColonyId]; if(!p) return;
        const cost=upgradeCost(p,"growth");
        if(Math.floor(score)>=cost){
          score-=cost; p.growthLevel++;
          scoreText.textContent=Math.floor(score).toString();
          updateUpgradeUI(); updateSkillUI();
        }
      });
      attackBtn.addEventListener("click", ()=>{
        if(playerColonyId===null||gameState!=="running") return;
        const p=colonies[playerColonyId]; if(!p) return;
        const cost=upgradeCost(p,"attack");
        if(Math.floor(score)>=cost){
          score-=cost; p.attackLevel++;
          scoreText.textContent=Math.floor(score).toString();
          updateUpgradeUI(); updateSkillUI();
        }
      });
      defenseBtn.addEventListener("click", ()=>{
        if(playerColonyId===null||gameState!=="running") return;
        const p=colonies[playerColonyId]; if(!p) return;
        const cost=upgradeCost(p,"defense");
        if(Math.floor(score)>=cost){
          score-=cost; p.defenseLevel++;
          scoreText.textContent=Math.floor(score).toString();
          updateUpgradeUI(); updateSkillUI();
        }
      });

      nutrientBtn.addEventListener("click", ()=>{
        if(playerColonyId===null||gameState!=="running") return;
        const p=colonies[playerColonyId]; if(!p) return;
        if(p.nutrientCooldown>0||Math.floor(score)<NUTRIENT_COST) return;
        score-=NUTRIENT_COST;
        p.nutrientTime=NUTRIENT_DURATION;
        p.nutrientCooldown=NUTRIENT_COOLDOWN;
        scoreText.textContent=Math.floor(score).toString();
        updateSkillUI();
      });
      toxinBtn.addEventListener("click", ()=>{
        if(playerColonyId===null||gameState!=="running") return;
        const p=colonies[playerColonyId]; if(!p) return;
        if(p.toxinCooldown>0||Math.floor(score)<TOXIN_COST) return;
        score-=TOXIN_COST;
        p.toxinCooldown=TOXIN_COOLDOWN;
        scoreText.textContent=Math.floor(score).toString();

        const aliveCounts=new Array(colonies.length).fill(0);
        if(grid){
          for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
            const o=grid[y][x]; if(o>=0) aliveCounts[o]++;
          }
        }
        const targetId=findStrongestEnemy(aliveCounts);
        performToxinBurstFor(playerColonyId,targetId,(p.mutationState||{}).focusedToxin>0);
        updateSkillUI();
      });
      shieldBtn.addEventListener("click", ()=>{
        if(playerColonyId===null||gameState!=="running") return;
        const p=colonies[playerColonyId]; if(!p) return;
        if(p.shieldCooldown>0||Math.floor(score)<SHIELD_COST) return;
        score-=SHIELD_COST;
        p.shieldTime=SHIELD_DURATION;
        p.shieldCooldown=SHIELD_COOLDOWN;
        scoreText.textContent=Math.floor(score).toString();
        updateSkillUI();
      });

      specialBtn.addEventListener("click", ()=>{
        if(playerColonyId==null||gameState!=="running") return;
        const p=colonies[playerColonyId];
        useSpecial(p);
        updateSkillUI();
      });

      // ===== start =====
      resizeCanvas();
      showIntro();
      updateLegendUI();
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
